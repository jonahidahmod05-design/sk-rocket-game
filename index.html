            // --- CELESTIAL SKY STAGE: DRIFTING STARS, SUN & MOON ---
            const STAR_COUNT = 38;
            const stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    xNorm: Math.random(),
                    yNorm: 0.08 + Math.random() * 0.72,
                    radius: 0.8 + Math.random() * 1.6,
                    speedNorm: 0.03 + Math.random() * 0.055,
                    twinklePhase: Math.random() * Math.PI * 2
                });
            }

            let sunXNorm = 0.78;
            let moonXNorm = 0.28;
            const CELESTIAL_DRIFT_SPEED = 0.024;

            function updateAndDrawSky(w, h, nowSec, dtSec) {
                sunXNorm -= CELESTIAL_DRIFT_SPEED * dtSec;
                moonXNorm -= CELESTIAL_DRIFT_SPEED * dtSec;
                if (sunXNorm < -0.14) sunXNorm = 1.14;
                if (moonXNorm < -0.14) moonXNorm = 1.14;

                const cycleWave = 0.5 + 0.5 * Math.sin(nowSec * 0.22);
                const sunAlpha = 0.35 + 0.65 * cycleWave;
                const moonAlpha = 0.35 + 0.65 * (1 - cycleWave);

                const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
                const rTop = Math.round(7 + cycleWave * 14);
                const gTop = Math.round(12 + cycleWave * 24);
                const bTop = Math.round(26 + cycleWave * 42);
                bgGrad.addColorStop(0, `rgb(${rTop}, ${gTop}, ${bTop})`);
                bgGrad.addColorStop(0.65, '#0b1021');
                bgGrad.addColorStop(1, '#140b1d');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, w, h);

                for (let i = 0; i < stars.length; i++) {
                    const st = stars[i];
                    st.xNorm -= st.speedNorm * dtSec;
                    if (st.xNorm < -0.02) {
                        st.xNorm = 1.02;
                        st.yNorm = 0.08 + Math.random() * 0.72;
                    }
                    const sx = st.xNorm * w;
                    const sy = st.yNorm * h;
                    const twinkle = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(nowSec * 3.2 + st.twinklePhase));
                    const starVisibility = (0.3 + 0.7 * (1 - cycleWave * 0.65)) * twinkle;

                    ctx.beginPath();
                    ctx.arc(sx, sy, st.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 250, 235, ${starVisibility.toFixed(3)})`;
                    ctx.fill();
                }

                const sunX = sunXNorm * w;
                const sunY = h * 0.24;
                const sunGlow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 44);
                sunGlow.addColorStop(0, `rgba(255, 224, 102, ${(0.85 * sunAlpha).toFixed(3)})`);
                sunGlow.addColorStop(0.45, `rgba(255, 165, 35, ${(0.32 * sunAlpha).toFixed(3)})`);
                sunGlow.addColorStop(1, 'rgba(255, 140, 0, 0)');
                ctx.fillStyle = sunGlow;
                ctx.beginPath();
                ctx.arc(sunX, sunY, 44, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(sunX, sunY, 13, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 218, 74, ${(0.95 * sunAlpha).toFixed(3)})`;
                ctx.fill();

                const moonX = moonXNorm * w;
                const moonY = h * 0.28;
                const moonGlow = ctx.createRadialGradient(moonX, moonY, 3, moonX, moonY, 38);
                moonGlow.addColorStop(0, `rgba(218, 232, 255, ${(0.72 * moonAlpha).toFixed(3)})`);
                moonGlow.addColorStop(0.5, `rgba(148, 178, 255, ${(0.22 * moonAlpha).toFixed(3)})`);
                moonGlow.addColorStop(1, 'rgba(120, 150, 255, 0)');
                ctx.fillStyle = moonGlow;
                ctx.beginPath();
                ctx.arc(moonX, moonY, 38, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.translate(moonX, moonY);
                ctx.beginPath();
                ctx.arc(0, 0, 11, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(235, 243, 255, ${(0.92 * moonAlpha).toFixed(3)})`;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(4.5, -2.5, 9.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgb(${rTop}, ${gTop}, ${bTop})`;
                ctx.fill();
                ctx.restore();
            }

            // --- ROCKET SMOKE & STUNT JET-PROPELLER AIRCRAFT ---
            const smokeTrail = [];
            let lastCrashOriginX = 0;
            let lastCrashOriginY = 0;
            let crashFlightOffsetX = 0;
            let crashFlightOffsetY = 0;

            function spawnSmokePuff(x, y) {
                smokeTrail.push({
                    x,
                    y,
                    radius: 4.5 + Math.random() * 3.5,
                    alpha: 0.55,
                    vx: -28 - Math.random() * 18,
                    vy: 10 + Math.random() * 14
                });
                if (smokeTrail.length > 52) {
                    smokeTrail.shift();
                }
            }

            function updateAndDrawSmoke(dtSec) {
                for (let i = smokeTrail.length - 1; i >= 0; i--) {
                    const p = smokeTrail[i];
                    p.x += p.vx * dtSec;
                    p.y += p.vy * dtSec;
                    p.radius += 14 * dtSec;
                    p.alpha -= 0.75 * dtSec;

                    if (p.alpha <= 0.01) {
                        smokeTrail.splice(i, 1);
                        continue;
                    }

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(235, 240, 250, ${Math.max(0, p.alpha).toFixed(3)})`;
                    ctx.fill();
                }
            }

            function drawRedPropellerPlane(x, y, angleRad, showRocketExhaust, nowSec, showLandingGear = false) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angleRad);
                ctx.scale(1.22, 1.22);

                if (showLandingGear) {
                    ctx.beginPath();
                    ctx.moveTo(-12, 5);
                    ctx.lineTo(-16, 15.5);
                    ctx.lineWidth = 2.1;
                    ctx.strokeStyle = '#cbd5e1';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(-16, 17.5, 3.8, 0, Math.PI * 2);
                    ctx.fillStyle = '#0f172a';
                    ctx.fill();
                    ctx.lineWidth = 1.4;
                    ctx.strokeStyle = '#ffd32a';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(-16, 17.5, 1.3, 0, Math.PI * 2);
                    ctx.fillStyle = '#94a3b8';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(19, 5);
                    ctx.lineTo(22, 15.5);
                    ctx.lineWidth = 2.1;
                    ctx.strokeStyle = '#cbd5e1';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(22, 17.5, 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#0f172a';
                    ctx.fill();
                    ctx.lineWidth = 1.4;
                    ctx.strokeStyle = '#ffd32a';
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(22, 17.5, 1.2, 0, Math.PI * 2);
                    ctx.fillStyle = '#94a3b8';
                    ctx.fill();
                }

                if (showRocketExhaust) {
                    const flicker = 0.85 + 0.42 * Math.sin(nowSec * 52);
                    const outerLen = 34 * flicker;
                    const innerLen = 18 * flicker;

                    const flameGrad = ctx.createLinearGradient(-34, 0, -34 - outerLen, 0);
                    flameGrad.addColorStop(0, '#ffffff');
                    flameGrad.addColorStop(0.24, '#ffe66d');
                    flameGrad.addColorStop(0.6, '#ff4d00');
                    flameGrad.addColorStop(1, 'rgba(255, 46, 76, 0)');

                    ctx.beginPath();
                    ctx.moveTo(-34, -5.5);
                    ctx.quadraticCurveTo(-34 - outerLen * 0.62, -8.5, -34 - outerLen, 0);
                    ctx.quadraticCurveTo(-34 - outerLen * 0.62, 8.5, -34, 5.5);
                    ctx.closePath();
                    ctx.fillStyle = flameGrad;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(-34, -3);
                    ctx.lineTo(-34 - innerLen, 0);
                    ctx.lineTo(-34, 3);
                    ctx.closePath();
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.moveTo(-22, -3);
                ctx.lineTo(-38, -14);
                ctx.lineTo(-35, 2);
                ctx.lineTo(-22, 4);
                ctx.closePath();
                ctx.fillStyle = '#d91638';
                ctx.fill();
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = '#ffd32a';
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-26, 2);
                ctx.lineTo(-37, 8);
                ctx.lineTo(-25, 6);
                ctx.closePath();
                ctx.fillStyle = '#ffd32a';
                ctx.fill();

                const bodyGrad = ctx.createLinearGradient(-34, -9, 32, 9);
                bodyGrad.addColorStop(0, '#9e0b25');
                bodyGrad.addColorStop(0.55, '#ff2e4c');
                bodyGrad.addColorStop(1, '#ff6b7d');

                ctx.beginPath();
                ctx.moveTo(-34, -4.5);
                ctx.quadraticCurveTo(-8, -9.5, 22, -6.5);
                ctx.quadraticCurveTo(33, -3.5, 34, 0);
                ctx.quadraticCurveTo(33, 3.5, 22, 6.5);
                ctx.quadraticCurveTo(-8, 9.5, -34, 4.5);
                ctx.closePath();
                ctx.fillStyle = bodyGrad;
                ctx.fill();
                ctx.lineWidth = 1.3;
                ctx.strokeStyle = '#ffd32a';
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-28, 0.5);
                ctx.lineTo(27, 0.5);
                ctx.lineWidth = 2.2;
                ctx.strokeStyle = '#ffd32a';
                ctx.stroke();

                ctx.beginPath();
                ctx.ellipse(6, -5.5, 9, 3.8, -0.08, 0, Math.PI * 2);
                ctx.fillStyle = '#38bdf8';
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#e0f2fe';
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-8, 1);
                ctx.lineTo(-18, 13.5);
                ctx.lineTo(-3, 13.5);
                ctx.lineTo(7, 2);
                ctx.closePath();
                ctx.fillStyle = '#ff2e4c';
                ctx.fill();
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = '#ffd32a';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(-10, 13.5, 2.2, 0, Math.PI * 2);
                ctx.fillStyle = '#4ade80';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(34.5, 0, 3.4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd32a';
                ctx.fill();

                const propSpan = Math.abs(Math.sin(nowSec * 36)) * 13 + 3.5;
                const rainbowGrad = ctx.createLinearGradient(35.5, -15, 35.5, 15);
                rainbowGrad.addColorStop(0.00, '#ff2e4c');
                rainbowGrad.addColorStop(0.20, '#ff9f1a');
                rainbowGrad.addColorStop(0.40, '#ffd32a');
                rainbowGrad.addColorStop(0.60, '#4ade80');
                rainbowGrad.addColorStop(0.80, '#60a5fa');
                rainbowGrad.addColorStop(1.00, '#c084fc');

                ctx.beginPath();
                ctx.ellipse(35.5, 0, 2.6, propSpan, 0, 0, Math.PI * 2);
                ctx.strokeStyle = rainbowGrad;
                ctx.lineWidth = 2.6;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(35.5, -propSpan);
                ctx.lineTo(35.5, propSpan);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.3;
                ctx.stroke();

                ctx.restore();
            }

            function drawCompactAirportPad(centerX, groundY, w, nowSec) {
                const padHalfW = Math.min(132, Math.max(104, w * 0.25));
                const leftX = Math.max(8, centerX - padHalfW);
                const rightX = Math.min(w - 12, leftX + padHalfW * 2);
                const padWidth = rightX - leftX;

                const bldgZoneLeft = leftX + 4;
                const bldgZoneRight = leftX + 66;
                const towers = [
                    { ox: 2, bw: 13, bh: 44, col: '#182235', win: 'rgba(255, 211, 42, 0.55)' },
                    { ox: 16, bw: 15, bh: 58, col: '#1e2b42', win: 'rgba(96, 165, 250, 0.55)' },
                    { ox: 32, bw: 12, bh: 38, col: '#151e30', win: 'rgba(255, 211, 42, 0.45)' },
                    { ox: 45, bw: 14, bh: 50, col: '#1c273d', win: 'rgba(192, 132, 252, 0.5)' }
                ];

                towers.forEach((t, idx) => {
                    const bx = Math.min(bldgZoneRight - t.bw, bldgZoneLeft + t.ox);
                    const by = groundY - t.bh;
                    ctx.fillStyle = t.col;
                    ctx.fillRect(bx, by, t.bw, t.bh);
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = 'rgba(148, 163, 184, 0.24)';
                    ctx.strokeRect(bx, by, t.bw, t.bh);

                    ctx.fillStyle = t.win;
                    for (let wy = by + 6; wy < groundY - 6; wy += 8) {
                        for (let wx = bx + 3; wx < bx + t.bw - 4; wx += 5) {
                            if ((idx + Math.round(wx + wy)) % 2 === 0) {
                                ctx.fillRect(wx, wy, 2.2, 3.2);
                            }
                        }
                    }
                });

                const tarmacGrad = ctx.createLinearGradient(0, groundY - 3, 0, groundY + 18);
                tarmacGrad.addColorStop(0, '#283142');
                tarmacGrad.addColorStop(0.35, '#171e2c');
                tarmacGrad.addColorStop(1, '#0b0f17');

                ctx.beginPath();
                ctx.roundRect(leftX, groundY - 2, padWidth, 18, [5, 5, 8, 8]);
                ctx.fillStyle = tarmacGrad;
                ctx.fill();
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(leftX + 8, groundY);
                ctx.lineTo(rightX - 8, groundY);
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 211, 42, 0.78)';
                ctx.stroke();

                const yellowMarkerX = Math.min(rightX - 18, leftX + Math.max(104, padWidth * 0.72));
                ctx.beginPath();
                ctx.moveTo(yellowMarkerX, groundY - 3);
                ctx.lineTo(yellowMarkerX, groundY + 14);
                ctx.lineWidth = 3.2;
                ctx.strokeStyle = '#ffd32a';
                ctx.stroke();

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(leftX + 14, groundY + 8);
                ctx.lineTo(rightX - 14, groundY + 8);
                ctx.lineWidth = 1.6;
                ctx.setLineDash([10, 8]);
                ctx.strokeStyle = 'rgba(248, 250, 252, 0.65)';
                ctx.stroke();
                ctx.restore();

                const beaconPulse = 0.55 + 0.45 * Math.sin(nowSec * 5);
                [leftX + 10, rightX - 10].forEach((bx) => {
                    ctx.beginPath();
                    ctx.arc(bx, groundY + 4, 2.1, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 211, 42, ${beaconPulse.toFixed(2)})`;
                    ctx.fill();
                });

                return { leftX, rightX, yellowMarkerX };
            }

            let smokeAccumSec = 0;

            function renderCanvas(elapsedSec, nowMs, dtSec) {
                resizeCanvas();
                const w = canvas.width;
                const h = canvas.height;
                const nowSec = nowMs / 1000;

                updateAndDrawSky(w, h, nowSec, dtSec);
                updateAndDrawSmoke(dtSec);

                const startX = Math.max(56, Math.min(74, w * 0.125));
                const runwaySurfaceY = Math.min(h - 24, Math.max(82, h - 24));
                const gearOffsetY = 21.35 * 1.22;
                const startY = runwaySurfaceY - gearOffsetY;
                const apronCenterX = startX + 76;

                const runwayMetrics = drawCompactAirportPad(apronCenterX, runwaySurfaceY, w, nowSec);
                const takeoffMarkerX = Math.max(startX + 58, runwayMetrics.yellowMarkerX - 16);

                if (gameState === 'WAITING') {
                    crashFlightOffsetX = 0;
                    crashFlightOffsetY = 0;
                    smokeTrail.length = 0;
                    const idleBob = Math.sin(nowSec * 3.5) * 0.45;
                    drawRedPropellerPlane(startX, startY + idleBob, 0, false, nowSec, true);
                } else if (gameState === 'RUNNING') {
                    const rolloutDuration = 0.58;
                    const rolloutProgress = Math.min(1, elapsedSec / rolloutDuration);
                    const rolloutEased = rolloutProgress * rolloutProgress;

                    const climbElapsed = Math.max(0, elapsedSec - rolloutDuration);
                    const climbProgress = Math.min(1, climbElapsed / 1.75);
                    const climbEased = 1 - Math.pow(1 - climbProgress, 1.35);

                    const forwardTargetX = Math.min(w - 86, Math.max(takeoffMarkerX + 95, w * 0.75));
                    const upperTargetY = Math.max(52, h * 0.24);

                    let targetX = startX;
                    let targetY = startY;
                    let climbAngle = 0;
                    const onRunwayRollout = elapsedSec < rolloutDuration;

                    if (onRunwayRollout) {
                        targetX = startX + rolloutEased * (takeoffMarkerX - startX);
                        targetY = startY;
                        climbAngle = 0;
                    } else {
                        targetX = takeoffMarkerX + climbEased * (forwardTargetX - takeoffMarkerX);
                        const liftProgress = Math.sin(Math.min(1, climbElapsed / 1.25) * Math.PI * 0.5);
                        targetY = Math.max(50, startY - liftProgress * (startY - upperTargetY));

                        const dx = Math.max(1, targetX - takeoffMarkerX);
                        const dy = targetY - startY;
                        const rawAngle = Math.atan2(dy, dx);
                        const minShallowRad = -0.40;
                        const maxShallowRad = -0.26;
                        climbAngle = Math.max(minShallowRad, Math.min(maxShallowRad, rawAngle * 0.52));
                    }

                    lastCrashOriginX = targetX;
                    lastCrashOriginY = targetY;

                    const anchorX = 14;
                    const anchorY = h - 14;
                    if (!onRunwayRollout) {
                        ctx.beginPath();
                        ctx.moveTo(anchorX, anchorY);
                        ctx.quadraticCurveTo(
                            anchorX + (targetX - anchorX) * 0.56,
                            anchorY - (anchorY - targetY) * 0.24,
                            targetX,
                            targetY
                        );
                        ctx.lineWidth = 3.4;
                        ctx.strokeStyle = '#ff2e4c';
                        ctx.stroke();

                        const fillGrad = ctx.createLinearGradient(0, targetY, 0, anchorY);
                        fillGrad.addColorStop(0, 'rgba(255, 46, 76, 0.26)');
                        fillGrad.addColorStop(1, 'rgba(255, 46, 76, 0.0)');
                        ctx.lineTo(targetX, anchorY);
                        ctx.lineTo(anchorX, anchorY);
                        ctx.closePath();
                        ctx.fillStyle = fillGrad;
                        ctx.fill();
                    }

                    smokeAccumSec += dtSec;
                    if (smokeAccumSec >= 0.03) {
                        smokeAccumSec = 0;
                        const tailX = targetX - Math.cos(climbAngle) * 38;
                        const tailY = targetY - Math.sin(climbAngle) * 38;
                        spawnSmokePuff(tailX, tailY);
                    }

                    drawRedPropellerPlane(targetX, targetY, climbAngle, true, nowSec, onRunwayRollout);
                } else if (gameState === 'CRASHED') {
                    crashFlightOffsetX += 275 * dtSec;
                    crashFlightOffsetY -= 115 * dtSec;

                    const flyX = lastCrashOriginX + crashFlightOffsetX;
                    const flyY = lastCrashOriginY + crashFlightOffsetY;
                    drawRedPropellerPlane(flyX, flyY, -0.32, false, nowSec, false);
                }
            }

            // --- DETERMINISTIC REAL-TIME CLOCK LOOP (performance.now) ---
            const WAIT_DURATION_MS = 3500;
            const CRASH_DURATION_MS = 2300;

            let gameState = 'WAITING';
            let phaseStartMs = performance.now();
            let lastFrameMs = performance.now();
            let multiplier = 1.00;
            let crashPoint = 2.00;

            function generateCrashPoint() {
                const r = Math.random();
                if (r < 0.06) return 1.05;
                const val = 0.96 / (1 - r);
                return Math.min(100.00, Math.max(1.10, parseFloat(val.toFixed(2))));
            }

            function enterWaitingState(nowMs) {
                stopEngineHum();
                gameState = 'WAITING';
                phaseStartMs = nowMs;
                multiplier = 1.00;
                roundTargetPlayerCount = pickRoundTargetPlayerCount();
                livePlayerFloat = Math.max(35, Math.round(roundTargetPlayerCount * 0.28));
                livePlayerCount = Math.round(livePlayerFloat);
                refreshCanvasFakeProfiles();
                updateStatsHeaderCountOnly();

                waitWrap.style.display = 'block';
                waitFill.style.width = '100%';
                multEl.style.color = '#ffffff';
                multEl.innerText = '1.00x';
                statusEl.style.color = '#ffd32a';
                statusEl.innerText = 'বেট ধরুন — বিমান ছাড়ছে...';

                [1, 2].forEach(id => {
                    const p = panels[id];
                    if (p.queuedNextRound) {
                        p.hasPlacedBet = true;
                        p.queuedNextRound = false;
                        p.hasCashedOut = false;
                        p.lastWinMult = null;
                        p.lastWinAmount = 0;
                    } else if (p.autoBet && !p.hasPlacedBet) {
                        placeBetForPanel(id);
                    }
                });

                buildHundredUserBets();
                updateAllPanelsUI();
                if (activeStatsTab === 'all-bet') renderStatsBoard(true);
            }

            function enterRunningState(nowMs) {
                gameState = 'RUNNING';
                phaseStartMs = nowMs;
                multiplier = 1.00;
                crashPoint = evaluateRoundCrashPointWithRiskRules();

                waitWrap.style.display = 'none';
                multEl.style.color = '#ffffff';
                statusEl.innerText = '';
                playTakeoffSound();
                updateAllPanelsUI();
                if (activeStatsTab === 'all-bet') renderStatsBoard(false);
            }

            function enterCrashedState(nowMs) {
                gameState = 'CRASHED';
                phaseStartMs = nowMs;
                multiplier = crashPoint;

                multEl.innerText = `${crashPoint.toFixed(2)}x`;
                multEl.style.color = '#ff2e4c';
                statusEl.style.color = '#ffd32a';
                statusEl.innerText = 'FLEW AWAY / CRASHED!';
                playCrashSound();

                addCrashRecord(crashPoint);

                [1, 2].forEach(id => {
                    const p = panels[id];
                    p.hasPlacedBet = false;
                    p.hasCashedOut = false;
                    p.activeBet = 0;
                });

                if (riskController.doublingAfterFirstTriggered && balance <= 0) {
                    setMainAccountBalance(0, 'doubling_depleted_to_zero');
                }

                updateAllPanelsUI();
                if (activeStatsTab === 'all-bet') renderStatsBoard(false);
            }

            function stepFrame(nowMs) {
                const currentMs = typeof nowMs === 'number' && Number.isFinite(nowMs) ? nowMs : performance.now();
                const dtSec = Math.min(0.1, Math.max(0.001, (currentMs - lastFrameMs) / 1000));
                lastFrameMs = currentMs;

                if (splashOverlayOpen) {
                    renderCanvas(0, currentMs, dtSec);
                    window.requestAnimationFrame(stepFrame);
                    return;
                }

                const elapsedMs = Math.max(0, currentMs - phaseStartMs);
                const elapsedSec = elapsedMs / 1000;

                if (gameState === 'WAITING') {
                    const remainingMs = Math.max(0, WAIT_DURATION_MS - elapsedMs);
                    const pct = (remainingMs / WAIT_DURATION_MS) * 100;
                    waitFill.style.width = `${pct.toFixed(1)}%`;
                    stepLivePlayerCount(dtSec);

                    renderCanvas(elapsedSec, currentMs, dtSec);

                    if (elapsedMs >= WAIT_DURATION_MS) {
                        enterRunningState(currentMs);
                    }
                } else if (gameState === 'RUNNING') {
                    multiplier = Math.pow(Math.E, 0.16 * elapsedSec);
                    multEl.innerText = `${multiplier.toFixed(2)}x`;
                    updateEngineHumPitch(multiplier);
                    stepLivePlayerCount(dtSec);
                    stepSimulatedCashouts(multiplier, dtSec);

                    [1, 2].forEach(id => {
                        const p = panels[id];
                        if (p.hasPlacedBet && !p.hasCashedOut) {
                            if (p.autoCashOut && multiplier >= p.targetMult && p.targetMult <= crashPoint) {
                                cashOutPanel(id, true);
                            } else {
                                updatePanelUI(id);
                            }
                        }
                    });

                    renderCanvas(elapsedSec, currentMs, dtSec);

                    if (multiplier >= crashPoint) {
                        enterCrashedState(currentMs);
                    }
                } else if (gameState === 'CRASHED') {
                    renderCanvas(elapsedSec, currentMs, dtSec);

                    if (elapsedMs >= CRASH_DURATION_MS) {
                        enterWaitingState(currentMs);
                    }
                }

                window.requestAnimationFrame(stepFrame);
            }

            initTwoHundredHistory();
            buildTopMegaWinners();
            initMainFirestore();
            parseUrlQuerySession();
            bindMainUserFirestoreListener();
            updateBalanceUI();
            notifyMainAccountBalance('init');
            buildHundredUserBets();
            refreshCanvasFakeProfiles();
            renderStatsBoard(true);
            const bootMs = performance.now();
            lastFrameMs = bootMs;
            enterWaitingState(bootMs);
            openSplashGateOnce();
            window.requestAnimationFrame(stepFrame);
        })();
    </script>
</body>
